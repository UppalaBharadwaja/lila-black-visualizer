<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILA BLACK — Player Journey Visualizer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">
    <header class="top-bar">
        <h1>LILA BLACK — Player Journey Visualizer</h1>
        <div id="stats-bar"></div>
    </header>
    <div class="main-content">
        <aside id="sidebar">
            <section class="filters-section">
                <h2>Filters</h2>
                <div class="filter-group">
                    <label for="map-filter">Map</label>
                    <select id="map-filter">
                        <option value="">All Maps</option>
                        <option value="AmbroseValley">AmbroseValley</option>
                        <option value="GrandRift">GrandRift</option>
                        <option value="Lockdown">Lockdown</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="date-filter">Date</label>
                    <select id="date-filter">
                        <option value="">All Dates</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="match-filter">Match</label>
                    <select id="match-filter">
                        <option value="">Select Match</option>
                    </select>
                </div>
                <div id="match-info" class="info-panel">
                    <!-- Match details will go here -->
                </div>
            </section>
            
            <hr class="divider">
            
            <section class="display-section">
                <h2>Display</h2>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="toggle-humans" checked> Show Humans</label>
                    <label><input type="checkbox" id="toggle-bots" checked> Show Bots</label>
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="toggle-kills" checked> Kills</label>
                    <label><input type="checkbox" id="toggle-deaths" checked> Deaths</label>
                    <label><input type="checkbox" id="toggle-loot" checked> Loot</label>
                    <label><input type="checkbox" id="toggle-storm" checked> Storm Deaths</label>
                </div>
            </section>
            
            <hr class="divider">
            
            <section class="heatmap-section">
                <h2>Heatmap</h2>
                <div class="radio-group">
                    <label><input type="radio" name="heatmap-mode" value="none" checked> None</label>
                    <label><input type="radio" name="heatmap-mode" value="kills"> Kill Zones</label>
                    <label><input type="radio" name="heatmap-mode" value="deaths"> Death Zones</label>
                    <label><input type="radio" name="heatmap-mode" value="traffic"> Traffic</label>
                    <label><input type="radio" name="heatmap-mode" value="loot"> Loot Spots</label>
                </div>
            </section>
            
            <hr class="divider">
            
            <section id="playback-panel" class="playback-section">
                <h2>Playback</h2>
                <div class="playback-controls">
                    <button id="play-btn" class="play-btn">▶</button>
                    <div class="speed-controls">
                        <button class="speed-btn active" data-speed="1">1x</button>
                        <button class="speed-btn" data-speed="2">2x</button>
                        <button class="speed-btn" data-speed="4">4x</button>
                        <button class="speed-btn" data-speed="8">8x</button>
                    </div>
                </div>
                <div class="timeline-container">
                    <input type="range" id="timeline-slider" min="0" max="1000" value="0">
                    <span id="time-display">0:00</span>
                </div>
            </section>
        </aside>
        
        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/map.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/heatmap.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
